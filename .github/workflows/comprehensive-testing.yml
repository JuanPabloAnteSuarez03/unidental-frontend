name: 🧪 Comprehensive Testing Suite

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  schedule:
    # Ejecutar tests completos diariamente a las 2 AM
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'
  FORCE_COLOR: 3

jobs:
  # Job 1: Tests Unitarios y de Integración (Críticos)
  unit-integration:
    name: 🔧 Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🛠️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: |
          npm ci
          npm ls --depth=0
      
      - name: 🧪 Run Unit Tests
        run: |
          npm run test:unit
          echo "✅ Unit tests completed"
      
      - name: 🔗 Run Integration Tests
        run: |
          npm run test:integration
          echo "✅ Integration tests completed"
      
      - name: 📊 Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unit,integration
          name: unit-integration-coverage
          fail_ci_if_error: true

  # Job 2: Tests E2E (Críticos)
  e2e:
    name: 🌐 E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci
      
      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: 🌐 Run E2E Tests
        run: |
          npm run test:e2e -- --project=${{ matrix.browser }}
          echo "✅ E2E tests completed for ${{ matrix.browser }}"
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      
      - name: 📤 Upload E2E Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Job 3: Tests de Accesibilidad
  accessibility:
    name: ♿ Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci
      
      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps chromium
      
      - name: ♿ Run Accessibility Tests
        run: |
          npm run test:accessibility
          echo "✅ Accessibility tests completed"
      
      - name: 📤 Upload Accessibility Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: test-results/accessibility-report/
          retention-days: 7

  # Job 4: Tests de Performance
  performance:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci
      
      - name: 🏗️ Build Application
        run: npm run build
      
      - name: ⚡ Run Lighthouse CI
        run: |
          npm run test:lighthouse
          echo "✅ Performance tests completed"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      
      - name: 📤 Upload Performance Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            lighthouse-ci-data/
            test-results/lighthouse-report/
          retention-days: 7

  # Job 5: Tests Visuales
  visual:
    name: 👁️ Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci
      
      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps chromium
      
      - name: 👁️ Run Visual Tests
        run: |
          npm run test:visual
          echo "✅ Visual regression tests completed"
      
      - name: 📤 Upload Visual Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-results
          path: |
            test-results/visual-report/
            test-results/screenshots/
          retention-days: 7

  # Job 6: Security & Bundle Analysis
  security:
    name: 🔒 Security & Bundle Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci
      
      - name: 🔒 Run Security Audit
        run: |
          npm run test:security
          echo "✅ Security tests completed"
      
      - name: 📦 Check Bundle Size
        run: |
          npm run build
          npm run test:bundle
          echo "✅ Bundle size check completed"
      
      - name: 📤 Upload Security Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: test-results/security-report/
          retention-days: 7

  # Job 7: Load Testing (Solo en schedule y main)
  load:
    name: 📈 Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci
      
      - name: 🚀 Start Application
        run: |
          npm run build
          npm run preview &
          sleep 10
        
      - name: 📈 Run Load Tests
        run: |
          npm run test:stress
          echo "✅ Load tests completed"
      
      - name: 📤 Upload Load Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-results
          path: test-results/load-report/
          retention-days: 7

  # Job 8: Comprehensive Report
  report:
    name: 📊 Generate Comprehensive Report
    runs-on: ubuntu-latest
    needs: [unit-integration, e2e, accessibility, performance, visual, security]
    if: always()
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install Dependencies
        run: npm ci
      
      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts/
      
      - name: 📊 Generate Comprehensive Report
        run: |
          node scripts/test-monitor.js
          echo "✅ Comprehensive report generated"
      
      - name: 📤 Upload Comprehensive Report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-report
          path: |
            test-results/comprehensive-test-report.html
            test-results/test-results.json
          retention-days: 30
      
      - name: 📋 Comment PR with Results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = './test-results/test-results.json';
            
            if (fs.existsSync(path)) {
              const results = JSON.parse(fs.readFileSync(path, 'utf8'));
              const comment = `
              ## 🧪 Comprehensive Testing Report
              
              **Overall Results:**
              - ✅ **Passed:** ${results.metrics.passed}
              - ❌ **Failed:** ${results.metrics.failed}
              - 📊 **Success Rate:** ${results.metrics.successRate}%
              - ⏱️ **Duration:** ${Math.round(results.metrics.duration / 1000)}s
              
              **Critical Failures:** ${results.metrics.criticalFailures}
              
              [📊 View Detailed Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # Job 9: Deploy Reports (Solo en main)
  deploy-reports:
    name: 🚀 Deploy Test Reports
    runs-on: ubuntu-latest
    needs: [report]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Download Report
        uses: actions/download-artifact@v4
        with:
          name: comprehensive-report
          path: ./reports
      
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: test-reports
          keep_files: true

  # Job 10: Notification
  notify:
    name: 📢 Notify Results
    runs-on: ubuntu-latest
    needs: [unit-integration, e2e, accessibility, performance, visual, security, report]
    if: always()
    
    steps:
      - name: 📢 Notify Success
        if: needs.unit-integration.result == 'success' && needs.e2e.result == 'success'
        run: |
          echo "🎉 All critical tests passed!"
          echo "✅ Unit & Integration: ${{ needs.unit-integration.result }}"
          echo "✅ E2E: ${{ needs.e2e.result }}"
          echo "✅ Report: ${{ needs.report.result }}"
      
      - name: 📢 Notify Failure
        if: needs.unit-integration.result == 'failure' || needs.e2e.result == 'failure'
        run: |
          echo "❌ Critical tests failed!"
          echo "🔧 Unit & Integration: ${{ needs.unit-integration.result }}"
          echo "🌐 E2E: ${{ needs.e2e.result }}"
          echo "📊 Report: ${{ needs.report.result }}"
          exit 1
      
      - name: 📢 Notify Warnings
        if: needs.accessibility.result == 'failure' || needs.performance.result == 'failure' || needs.visual.result == 'failure'
        run: |
          echo "⚠️ Some non-critical tests failed"
          echo "♿ Accessibility: ${{ needs.accessibility.result }}"
          echo "⚡ Performance: ${{ needs.performance.result }}"
          echo "👁️ Visual: ${{ needs.visual.result }}"
          echo "🔒 Security: ${{ needs.security.result }}" 